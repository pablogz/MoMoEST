name: momoest
description: Modern Movement Educational Semantic Tool is an application designed to allow teachers to annotate spatial things, learning tasks, and itineraries, which are transparently stored as Linked Open Data (LOD). The application also enables students to access and use these learning resources in a transparent way.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

